{% extends "base_root.html" %}
{% block title %}GLHF - root{% endblock %}

{% block content %}
<div class="arch-terminal-root">

    <!-- Terminal (Shell) -->
  <div class="terminal-block">
    <pre class="terminal-title">root@glhf:~</pre>
    <form method="post" class="terminal-form" autocomplete="off">
      <span class="prompt"># </span>
      <input type="text" name="cmd" class="terminal-input" placeholder="Enter shell command"
        onkeydown="if(event.key=='Enter'){this.form.submit();}">
    </form>
    <pre class="command-output">{{ output|safe }}</pre>
  </div>

  <!-- SQL Interface -->
  <div class="terminal-block">
    <pre class="terminal-title">sqlite> glhf.db</pre>
    <form method="post" class="terminal-form" autocomplete="off">
      <span class="prompt">sql&gt;</span>
      <input type="text" name="sql" class="terminal-input" placeholder="SELECT * FROM users;"
        onkeydown="if(event.key=='Enter'){this.form.submit();}">
    </form>
    <pre class="command-output">{{ sql_output|safe }}</pre>
  </div>

  <!-- Download source -->
  <div class="terminal-block">
    <span class="terminal-title">[download]</span>
    <a href="/root/download_source" class="download-link">source_leak.tar</a>
  </div>

  <!-- pending_users.json -->
  <div class="terminal-block">
    <span class="terminal-title">pending_users.json</span>
    <pre class="json-output">{{ pending }}</pre>
  </div>


</div>
{% endblock %}
