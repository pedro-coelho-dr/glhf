{% extends "public_profile.html" %}

{% block edit %}
<div class="d-flex justify-content-center mt-4">
  <div class="card edit-profile-form px-4 py-3">
    <form method="post" action="/profile" enctype="multipart/form-data">
      <h5 class="text-center mb-3">Edit Profile</h5>

      <div class="mb-3">
        <label for="bio" class="form-label">Bio</label>
        <textarea class="form-control" id="bio" name="bio" rows="3">{{ user.bio or '' }}</textarea>
      </div>

      <div class="mb-3">
        <label for="avatar" class="form-label">Avatar</label>
        <input class="form-control" type="file" id="avatar" name="avatar">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">New Password</label>
        <input type="password" class="form-control" id="password" name="password">
      </div>

      <button type="submit" class="btn btn-outline-light w-100">Save</button>
    </form>
  </div>
</div>
{% endblock %}
