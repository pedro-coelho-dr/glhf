{% extends 'base.html' %}
{% block title %}Register - GLHF{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="form-container" style="width: 100%; max-width: 420px;">
    <div class="glhf-logo register">register</div>
    <form method="POST" action="/register">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ username }}">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password">
      </div>
      {% if message %}
        <div class="login-error">{{ message|safe }}</div>
      {% endif %}
      <button type="submit" class="btn btn-cyan w-100">SIGN UP</button>
      <div class="text-center mt-3">
        <a href="/login" class="text-secondary">Back to Login</a>
      </div>
    </form>
  </div>
</div>
<div class="notebook-links">
  <a href="/download/readme.txt" class="notebook-btn">💾 readme.txt</a>
  <a href="/download/nicks.txt" class="notebook-btn">💾 nicks.txt</a>
  <a href="/download/rockyou.txt" class="notebook-btn">💾 rockyou.txt</a>
</div>
{% endblock %}
