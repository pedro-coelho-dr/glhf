<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GLHF{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('lobby.static', filename='img/favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('lobby.static', filename='css/bootstrap.min.css') }}">
  <link href="{{ url_for('lobby.static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>
  <script src="{{ url_for('lobby.static', filename='js/bootstrap.min.js') }}"></script>
  <script src="/lobby_static/js/main.js"></script>
</body>
</html>
