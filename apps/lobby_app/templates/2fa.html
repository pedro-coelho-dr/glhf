{% extends 'base_lobby.html' %}
{% block title %}2fa - GLHF{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="form-container" style="width: 100%; max-width: 320px;">
    <form method="POST" action="/2fa" onsubmit="joinCode()">
      <div class="mb-3">
        <label class="form-label"></label>
        <div class="code-input-group">
          <input type="text" maxlength="1" pattern="\d" required>
          <input type="text" maxlength="1" pattern="\d" required>
          <input type="text" maxlength="1" pattern="\d" required>
          <input type="text" maxlength="1" pattern="\d" required>
        </div>
        <input type="hidden" name="code" id="code">
      </div>
      {% if error %}
        <div class="login-error">{{ error|safe }}</div>
      {% endif %}
      <button type="submit" class="btn-2fa w-100">VALIDATE</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function joinCode() {
  const inputs = document.querySelectorAll('.code-input-group input');
  const code = Array.from(inputs).map(i => i.value).join('');
  document.getElementById('code').value = code;
}

document.addEventListener('DOMContentLoaded', () => {
  const inputs = document.querySelectorAll('.code-input-group input');
  inputs.forEach((input, index) => {
    input.addEventListener('input', () => {
      if (input.value && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    });
  });
});
</script>
{% endblock %}
