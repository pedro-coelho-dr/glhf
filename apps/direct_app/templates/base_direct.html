<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GLHF{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('direct.static', filename='img/favicon.ico') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('direct.static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('direct.static', filename='css/navbar.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">

  {% include 'navbar.html' with context %}

  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
